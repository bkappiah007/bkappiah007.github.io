- title: "Comparative Statistical and Machine Learning Approaches for Predicting Life Expectancy in African
Countries"
  description: "This paper compares seven statistical and machine learning approaches for predicting life expectancy across 54 African countries, using 832 country-year observations and 20 demographic, socioeconomic, and health indicators from the WHO Life Expectancy dataset (2000 to 2015). Multiple Linear Regression, Stepwise Regression, Ridge, LASSO, Elastic Net, Random Forest, and Gradient Boosting Machine were evaluated using RMSE, MAE, and R² under repeated 10-fold cross-validation, with bootstrap validation used to assess stability. Ensemble methods clearly outperformed the regression approaches, with Random Forest achieving the lowest test error (RMSE = 1.95, R² = 0.94). Variable importance analysis converged across all three modelling frameworks on HIV/AIDS prevalence, Income Composition of Resources, and Adult Mortality as the leading determinants of life expectancy."
  date: 2025
  href: https://drive.google.com/file/d/1WXIJFU3B3Zz0t1I634XLa-p5K_x0bntP/view?usp=sharing
  image: files/images/life expectancy.jpg
  listing:
    type: default
